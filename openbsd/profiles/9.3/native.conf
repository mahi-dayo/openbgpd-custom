# Native source revision corresponding to OpenBGPD 9.3.
COMMIT=dd857f136d9cd8eefdef7374eba3eafddae65a00
ARCHIVE_SHA256=d692eed1fdb73dfbb50f47af289358001bf4dd4109f02b65dfe50f75e686edf9
IMSG_PATCH=native93-imsg.patch
IMSG_MAKEFILE=native93-imsg.mk

native_platform()
{
    case "$1" in
        7.9)
            compat=openbsd79-absolute-argv0
            startup_patch=openbgpd-9.3-openbsd79.patch
            cppflags+=(-DOPENBGPD_OPENBSD79_COMPAT)
            ;;
        8.*) compat=none ;;
        *) return 1 ;;
    esac
}
